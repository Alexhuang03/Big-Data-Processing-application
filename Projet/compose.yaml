services:
  kafka:
    image: apache/kafka-native:4.1.1
    container_name: imdb_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - imdb-net

  spark:
    # Pinned: the PYTHONPATH below depends on the py4j version of this image.
    image: quay.io/jupyter/pyspark-notebook:spark-4.2.1
    container_name: imdb_spark
    user: root
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      NB_UID: ${UID:-1000}
      NB_GID: ${GID:-1000}
      CHOWN_EXTRA: /home/jovyan/data,/home/jovyan/output
      CHOWN_EXTRA_OPTS: -R
      # Lets "docker exec ... python -m <module>" find pyspark and our code.
      PYTHONPATH: /home/jovyan/src:/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
      PYSPARK_PYTHONPATH_SET: "1"
      SPARK_MASTER: ${SPARK_MASTER:-local[8]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-6g}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-200}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./src:/home/jovyan/src
      - ./notebooks:/home/jovyan/work
      - ./output:/home/jovyan/output
      # Named volume: much faster than a Windows bind mount for multi-GB Parquet files.
      - imdb_data:/home/jovyan/data
    networks:
      - imdb-net
    depends_on:
      - kafka

volumes:
  imdb_data:

networks:
  imdb-net:
    driver: bridge
